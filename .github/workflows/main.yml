name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint tests and run the seeded shuffled suite
        run: npm test
        env:
          TEST_SHUFFLE_SEED: '20261011'
      - name: Build frontend and validate production Worker packaging
        run: npm run check:deploy
        env:
          WRANGLER_SEND_METRICS: 'false'

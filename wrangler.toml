# Deploy with an explicit environment. Local development uses preview bindings
# simulated locally; production resources are never used by `npm run dev`.
name = "earthquake-local"
account_id = "f7e27d63f4766d7fb6a0f5b4789e2cdb"
main = "src/worker.js"
compatibility_date = "2024-06-05"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"
watch_dir = ["src", "functions", "shared", "public"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# API, sitemap and crawler responses must pass through the Worker first.
run_worker_first = true

[cache]
enabled = true
# Each release starts a fresh response cache; never serve a previous release's HTML.
cross_version_cache = false

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 0.01

# Dedicated preview resources. No automatic cron ingestion in preview.
[env.preview]
name = "earthquake-reconcile-preview"
workers_dev = true
kv_namespaces = [
  { binding = "CLUSTER_KV", id = "ff6649da6e9c401d83d39531b3c9da9d" },
  { binding = "USGS_LAST_RESPONSE_KV", id = "30fa803774a44c5c93022a4f25679ba9" }
]
d1_databases = [
  { binding = "DB", database_name = "earthquake-reconcile-preview", database_id = "b027cfcd-bee0-4d5e-adf5-9505c3a8626d", migrations_dir = "migrations" }
]
r2_buckets = [
  { binding = "GEOJSON_BUCKET", bucket_name = "earthquake-reconcile-preview" }
]

[env.preview.version_metadata]
binding = "WORKER_VERSION_METADATA"

[env.preview.triggers]
crons = []

[env.preview.vars]
DEPLOYMENT_ENVIRONMENT = "preview"

[[env.preview.queues.producers]]
binding = "GEOJSON_QUEUE"
queue = "earthquake-reconcile-preview"

[[env.preview.queues.consumers]]
queue = "earthquake-reconcile-preview"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

[env.production]
name = "earthquake"
workers_dev = true
# Domain ownership is explicit and matches the verified live custom domain.
routes = [{ pattern = "earthquakeslive.com", custom_domain = true }]
kv_namespaces = [
  { binding = "CLUSTER_KV", id = "2e7c7b5faf2f47868a048bd8043edebc" },
  { binding = "USGS_LAST_RESPONSE_KV", id = "8bebf55e19a14299b35d1d4f6a53d2b5" },
  # Retained for previous releases and already-open clients' hashed chunks.
  { binding = "STATIC_KV", id = "103d46c25b71471489abb0989cc2ecfa" }
]
d1_databases = [
  { binding = "DB", database_name = "PrimaryDB", database_id = "8a0a26e9-ba3c-4984-9023-c1803f611a05", migrations_dir = "migrations" }
]
r2_buckets = [
  { binding = "GEOJSON_BUCKET", bucket_name = "geojson-bucket" }
]

[env.production.version_metadata]
binding = "WORKER_VERSION_METADATA"

[env.production.vars]
DEPLOYMENT_ENVIRONMENT = "production"
# Both flags are required for the revisioned production list writer. The
# release gate verifies the drained paused predecessor and 0022 schema.
LIST_PUBLICATION_PAUSED = "false"
DURABLE_INGESTION_ENABLED = "true"
# Insert-only reconciliation of the existing complete month snapshot.
MONTH_COVERAGE_ENABLED = "true"

[env.production.triggers]
crons = ["*/5 * * * *", "*/30 * * * *", "0 0 * * *", "*/10 * * * *", "2-59/5 * * * *"]

[[env.production.queues.producers]]
binding = "GEOJSON_QUEUE"
queue = "geojson-queue"

# Match the live consumer's actual 5-second timeout (old max_wait_ms was ignored).
[[env.production.queues.consumers]]
queue = "geojson-queue"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
retry_delay = 0
